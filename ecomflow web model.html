<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcomFlow | Amazon Private Label Services to Build and Grow Your Brand</title>
  <meta name="description"
    content="From product research and sourcing to listing optimization and PPC, get practical support across your Amazon journey.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0F2A47;
      --navy2: #183B61;
      --amber: #F5A623;
      --amber-d: #B76E00;
      --soft: #FFF4DC;
      --bg: #fff;
      --alt: #F4F6F9;
      --ink: #12202F;
      --mute: #56657A;
      --line: #E1E6ED;
      --r: 12px
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    a {
      color: inherit;
      text-decoration: none
    }

    ul {
      list-style: none
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    :focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px
    }

    .w {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px
    }

    h1,
    h2,
    h3 {
      color: var(--navy);
      line-height: 1.15;
      letter-spacing: -.02em
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 800
    }

    h2 {
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      font-weight: 800
    }

    h3 {
      font-size: 1.08rem;
      font-weight: 700
    }

    p {
      color: var(--mute)
    }

    section {
      padding: 72px 0
    }

    .alt {
      background: var(--alt)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: .93rem;
      border: 2px solid transparent;
      cursor: pointer;
      transition: .18s
    }

    .b1 {
      background: var(--amber);
      color: var(--navy)
    }

    .b1:hover {
      background: #ffb83d
    }

    .b2 {
      border-color: var(--navy);
      color: var(--navy)
    }

    .b2:hover {
      background: var(--navy);
      color: #fff
    }

    .sm {
      padding: 9px 18px;
      font-size: .84rem
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top, 0)
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
      gap: 16px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--navy)
    }

    .logo img {
      height: 40px;
      width: auto;
      display: block
    }

    .logo b {
      color: var(--amber-d)
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .menu>a,
    .dd>button {
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: .92rem;
      color: var(--ink);
      background: none;
      border: 0;
      cursor: pointer
    }

    .menu>a:hover,
    .dd>button:hover,
    .menu .on {
      background: var(--soft)
    }

    .dd {
      position: relative
    }

    .dd-p {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: 0 18px 40px rgba(15, 42, 71, .15);
      padding: 8px;
      min-width: 270px
    }

    .dd:hover .dd-p,
    .dd.open .dd-p,
    .dd:focus-within .dd-p {
      display: block
    }

    .dd-p a {
      display: block;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 500
    }

    .dd-p a:hover {
      background: var(--soft)
    }

    .burger {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 1.3rem;
      color: var(--navy)
    }

    #mnav {
      display: none;
      padding: 8px 24px 20px;
      border-top: 1px solid var(--line);
      background: #fff;
      max-height: 75vh;
      overflow: auto
    }

    #mnav.open {
      display: block
    }

    #mnav a {
      display: block;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-weight: 600
    }

    #mnav small {
      display: block;
      margin: 14px 0 2px;
      color: var(--mute);
      font-weight: 700
    }

    @media(max-width:920px) {

      .menu,
      .nav>.btn {
        display: none
      }

      .burger {
        display: block
      }
    }

    .hero {
      background: var(--navy);
      padding: 84px 0 76px;
      position: relative;
      overflow: hidden
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -120px;
      top: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 166, 35, .28), transparent 68%)
    }

    .hg {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 48px;
      align-items: center;
      position: relative;
      z-index: 1
    }

    .hero h1 {
      color: #fff;
      margin-bottom: 20px
    }

    .hero p {
      color: #B9C7DA;
      font-size: 1.12rem;
      max-width: 540px
    }

    .cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px
    }

    .hero .b2 {
      border-color: #4B6A8D;
      color: #fff
    }

    .hero .b2:hover {
      background: #fff;
      color: var(--navy)
    }

    .route {
      background: var(--navy2);
      border: 1px solid #2A4D77;
      border-radius: 16px;
      padding: 22px
    }

    .route h3 {
      color: #fff;
      margin-bottom: 12px;
      font-size: .95rem
    }

    .route a {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #2A4D77;
      color: #DCE6F3;
      font-size: .9rem;
      font-weight: 600
    }

    .route a:last-child {
      border: 0
    }

    .route a:hover {
      color: var(--amber)
    }

    .route span {
      color: var(--amber)
    }

    @media(max-width:860px) {
      .hg {
        grid-template-columns: 1fr
      }
    }

    .head {
      max-width: 640px;
      margin-bottom: 36px
    }

    .head p {
      margin-top: 10px
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(3, 1fr)
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:620px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .card:hover {
      border-color: var(--amber)
    }

    .card p {
      font-size: .92rem
    }

    .card .more {
      margin-top: auto;
      padding-top: 8px;
      font-weight: 700;
      font-size: .88rem;
      color: var(--amber-d)
    }

    .card ul {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .card li {
      font-size: .76rem;
      background: var(--alt);
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--mute);
      font-weight: 600
    }

    .meta {
      font-size: .8rem;
      color: var(--mute)
    }

    .meta b {
      color: var(--ink)
    }

    .note {
      font-size: .8rem;
      background: var(--soft);
      border-left: 3px solid var(--amber);
      padding: 7px 10px;
      border-radius: 4px;
      color: #6B4600
    }

    .page {
      background: var(--navy);
      padding: 56px 0
    }

    .page h1 {
      color: #fff;
      font-size: clamp(1.9rem, 4vw, 2.8rem)
    }

    .page p {
      color: #B9C7DA;
      margin-top: 12px;
      max-width: 640px
    }

    .crumb {
      font-size: .85rem;
      color: var(--amber);
      font-weight: 700;
      margin-bottom: 10px;
      display: block
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0;
      counter-reset: s
    }

    .steps div {
      position: relative;
      padding-top: 34px;
      font-weight: 700;
      font-size: .9rem;
      color: var(--navy);
      text-align: center;
      counter-increment: s
    }

    .steps div::before {
      content: counter(s);
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--amber);
      color: var(--navy);
      font-size: .8rem;
      display: grid;
      place-items: center;
      z-index: 1
    }

    .steps div::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--line)
    }

    .steps div:last-child::after {
      display: none
    }

    @media(max-width:700px) {
      .steps {
        grid-template-columns: repeat(2, 1fr);
        gap: 22px 0
      }

      .steps div::after {
        display: none
      }
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center
    }

    @media(max-width:800px) {
      .two {
        grid-template-columns: 1fr;
        gap: 28px
      }
    }

    .ph {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin-bottom: 18px;
      background: #111
    }

    .fcard {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 30px
    }

    .fcard h3 {
      font-size: 1.3rem
    }

    .fcard .role {
      color: var(--amber-d);
      font-weight: 700;
      font-size: .92rem;
      margin: 4px 0 14px
    }

    .fcard p+p {
      margin-top: 10px
    }

    .band {
      background: var(--navy);
      border-radius: 20px;
      padding: 44px;
      text-align: center
    }

    .band h2 {
      color: #fff
    }

    .band p {
      color: #B9C7DA;
      margin: 10px auto 0;
      max-width: 520px
    }

    .band .cta {
      justify-content: center
    }

    form {
      display: grid;
      gap: 14px
    }

    label {
      font-weight: 700;
      font-size: .85rem;
      color: var(--navy);
      display: grid;
      gap: 6px
    }

    input,
    select,
    textarea {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink)
    }

    textarea {
      min-height: 120px;
      resize: vertical
    }

    .cl {
      display: grid;
      gap: 14px
    }

    .cl a,
    .cl div {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-weight: 600;
      font-size: .93rem;
      word-break: break-word
    }

    .cl small {
      display: block;
      color: var(--mute);
      font-weight: 500
    }

    .mods {
      columns: 2;
      column-gap: 28px
    }

    .mods li {
      break-inside: avoid;
      padding: 9px 0 9px 22px;
      position: relative;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      font-size: .93rem
    }

    .mods li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 17px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber)
    }

    @media(max-width:600px) {
      .mods {
        columns: 1
      }
    }

    footer {
      background: #0A1E34;
      color: #B9C7DA;
      padding: 52px 0 28px;
      font-size: .88rem
    }

    .fg {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 32px
    }

    @media(max-width:760px) {
      .fg {
        grid-template-columns: 1fr
      }
    }

    footer h4 {
      color: #fff;
      margin-bottom: 10px
    }

    footer li {
      padding: 4px 0
    }

    footer a:hover {
      color: var(--amber)
    }

    .flogo {
      width: 170px;
      height: auto;
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      display: block
    }

    .disc {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #1E3A59;
      font-size: .8rem;
      color: #8EA0B8
    }

    body {
      padding-bottom: env(safe-area-inset-bottom, 0)
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important
      }
    }
  </style>
</head>
